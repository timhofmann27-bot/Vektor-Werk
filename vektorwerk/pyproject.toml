[project]
name = "vektorwerk"
version = "0.1.0"
description = "Automatische Vektorisierung von Druckmotiven"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
  "vtracer>=0.6.11",
  "cairosvg>=2.7",
  "pypdf>=4.2",
]
